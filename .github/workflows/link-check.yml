name: Link Check

on:
  push:
    paths:
      - "data/**"
      - "scripts/link_checker.py"
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch: {}

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run link checker
        run: python3 scripts/link_checker.py
